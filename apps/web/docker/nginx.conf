# cache da verificação de sessão (evita consultar a API a cada tile do GeoServer)
proxy_cache_path /var/cache/nginx/auth levels=1 keys_zone=auth:2m max_size=20m inactive=2m;

upstream api {
  server api:8000;
  keepalive 16;
}

upstream geoserver {
  server geoserver:8080;
  keepalive 64;
}

server {
  listen 443 ssl;
  http2 on;
  server_name _;

  ssl_certificate     /etc/nginx/certs/server.crt;
  ssl_certificate_key /etc/nginx/certs/server.key;

  # muitas requisições simultâneas de tiles na mesma conexão
  http2_max_concurrent_streams 256;

  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json text/xml application/xml image/svg+xml;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  location / {
    try_files $uri /index.html;
  }

  # login: o GeoServer só responde a quem tem sessão válida na API
  location = /_auth {
    internal;
    proxy_pass http://api/auth/verificar;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_cache auth;
    proxy_cache_key $cookie_gm_sessao;
    proxy_cache_valid 204 30s;
    proxy_cache_valid 401 0;
  }

  # tiles do cache (WMTS): o navegador também pode guardar (privado: exige login)
  location /geoserver/gwc/ {
    auth_request /_auth;
    proxy_pass http://geoserver;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "private, max-age=3600";
  }

  # API (FastAPI) — o login é verificado lá
  location /api/ {
    proxy_pass http://api/;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_read_timeout 120s;
  }

  location /geoserver/ {
    auth_request /_auth;
    proxy_pass http://geoserver;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 120s;
  }
}
